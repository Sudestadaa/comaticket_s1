name: CI/CD Pipeline - Comaticket Microservice

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comaticket:latest

      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Detener y remover contenedor existente si está corriendo
            docker stop comaticket || true
            docker rm comaticket || true

            # 2. Descargar la imagen más reciente desde Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/comaticket:latest

            # 3. Limpiar imágenes huérfanas/antiguas para liberar espacio en EC2
            docker image prune -f

            # 4. Iniciar el nuevo contenedor con mapeo de puertos y almacenamiento EFS
            docker run -d \
              --name comaticket \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs-data \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/comaticket:latest
