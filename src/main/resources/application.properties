# Nombre de la aplicación
spring.application.name=comaticket
server.port=8080

# Configuración del origen de datos PostgreSQL RDS
spring.datasource.url=jdbc:postgresql://${DB_HOST:database-comaticket-s2.cxixpr27co0v.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Comaticket123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Ruta donde está montado el EFS 
aws.efs.mount-path=./efs-data

# Configuración de AWS S3
aws.s3.bucket-name=comaticket-s2
aws.s3.region=us-east-1

# Permitir multipart file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
